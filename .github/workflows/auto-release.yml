name: Auto release

# Every push to master (a merged PR) gets the next patch tag v1.7.N and a
# published release. Docs-only pushes are skipped.
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Tag next version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: next
        run: |
          last="$(git tag --list 'v1.7.*' | grep -E '^v1\.7\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$last" ]; then n=0; else n=$(( ${last##*.} + 1 )); fi
          tag="v1.7.$n"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ needs.tag.outputs.tag }}
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
